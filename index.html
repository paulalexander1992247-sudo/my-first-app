<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life & Work Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md text-center font-bold text-lg">
        Life & Work Hub
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full">
        
        <!-- Home Section -->
        <section id="section-home" class="space-y-4">
            <h2 class="text-xl font-semibold">Dashboard</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-sm text-slate-500">Work Shifts</p>
                    <p id="dash-shifts" class="text-lg font-bold">0 Logged</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-sm text-slate-500">Total Expenses</p>
                    <p id="dash-expenses" class="text-lg font-bold">$0.00</p>
                </div>
            </div>
        </section>

        <!-- Schedule Section -->
<section id="section-schedule" class="space-y-4 hidden">
    <div class="flex justify-between items-center">
        <h2 class="text-xl font-semibold">Schedule & Shifts</h2>
        <div class="space-x-1">
            <button onclick="filterSchedule('all')" id="filter-all" class="px-3 py-1 text-xs rounded-full bg-indigo-600 text-white font-medium">All</button>
            <button onclick="filterSchedule('today')" id="filter-today" class="px-3 py-1 text-xs rounded-full bg-slate-200 text-slate-700 font-medium">Today</button>
        </div>
    </div>

    <!-- Add Event Card -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
        <input type="text" id="shift-name" placeholder="Event Name (e.g., Cafe Shift, Doctor)" class="w-full p-2.5 text-sm rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        
        <div class="grid grid-cols-2 gap-2">
            <select id="shift-category" class="w-full p-2.5 text-sm rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                <option value="Work">🟢 Work Shift</option>
                <option value="Appointment">🔵 Appointment</option>
                <option value="Personal">🟠 Personal</option>
            </select>
            <input type="date" id="shift-date" class="w-full p-2.5 text-sm rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs text-slate-500">
            <div>
                <label class="block mb-1">Start Time</label>
                <input type="time" id="shift-start" class="w-full p-2 rounded-lg border border-slate-200">
            </div>
            <div>
                <label class="block mb-1">End Time</label>
                <input type="time" id="shift-end" class="w-full p-2 rounded-lg border border-slate-200">
            </div>
        </div>

        <button onclick="addShift()" class="w-full py-2.5 bg-indigo-600 text-white rounded-lg font-medium text-sm hover:bg-indigo-700 transition">Add to Schedule</button>
    </div>

    <!-- Event List -->
    <div id="shift-list" class="space-y-3"></div>
</section>

        <!-- Finances Section -->
        <section id="section-finances" class="space-y-4 hidden">
            <h2 class="text-xl font-semibold">Financial Tracker</h2>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
                <input type="text" id="expense-name" placeholder="Expense description" class="w-full p-2 border rounded-lg text-sm">
                <input type="number" id="expense-amount" placeholder="Amount ($)" class="w-full p-2 border rounded-lg text-sm">
                <button onclick="addExpense()" class="w-full bg-indigo-600 text-white p-2 rounded-lg font-medium text-sm">Log Expense</button>
            </div>
            <div id="expense-list" class="space-y-2"></div>
        </section>

        <!-- Health Section -->
        <section id="section-health" class="space-y-4 hidden">
            <h2 class="text-xl font-semibold">Health & Fitness</h2>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
                <input type="text" id="workout-name" placeholder="Workout or Diet note" class="w-full p-2 border rounded-lg text-sm">
                <button onclick="addWorkout()" class="w-full bg-indigo-600 text-white p-2 rounded-lg font-medium text-sm">Log Fitness Goal</button>
            </div>
            <div id="workout-list" class="space-y-2"></div>
        </section>

    </main>

    <!-- Bottom Navigation Bar for Mobile -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around p-3 shadow-lg">
        <button onclick="switchTab('home')" id="nav-home" class="text-indigo-600 font-medium text-sm">Home</button>
        <button onclick="switchTab('schedule')" id="nav-schedule" class="text-slate-400 font-medium text-sm">Schedule</button>
        <button onclick="switchTab('finances')" id="nav-finances" class="text-slate-400 font-medium text-sm">Finances</button>
        <button onclick="switchTab('health')" id="nav-health" class="text-slate-400 font-medium text-sm">Health</button>
    </nav>

    <!-- App Logic Script -->
    <script>
// Tab Switching Logic
function switchTab(tabName) {
    ['home', 'schedule', 'finances', 'health'].forEach(t => {
        const section = document.getElementById('section-' + t);
        const nav = document.getElementById('nav-' + t);
        if (section) section.classList.add('hidden');
        if (nav) nav.className = "text-slate-400 font-medium text-sm";
    });
    
    const activeSection = document.getElementById('section-' + tabName);
    const activeNav = document.getElementById('nav-' + tabName);
    if (activeSection) activeSection.classList.remove('hidden');
    if (activeNav) activeNav.className = "text-indigo-600 font-medium text-sm";
}

// Load schedule data on startup
let schedules = JSON.parse(localStorage.getItem('schedules')) || [];
let currentFilter = 'all';

document.addEventListener('DOMContentLoaded', () => {
    const todayStr = new Date().toISOString().split('T')[0];
    const dateInput = document.getElementById('shift-date');
    if (dateInput) dateInput.value = todayStr;
    renderSchedule();
});

function addShift() {
    const name = document.getElementById('shift-name').value.trim();
    const category = document.getElementById('shift-category').value;
    const date = document.getElementById('shift-date').value;
    const startTime = document.getElementById('shift-start').value;
    const endTime = document.getElementById('shift-end').value;

    if (!name || !date) {
        alert('Please enter an event name and date.');
        return;
    }

    const newEvent = {
        id: Date.now(),
        name,
        category,
        date,
        startTime,
        endTime
    };

    schedules.push(newEvent);
    localStorage.setItem('schedules', JSON.stringify(schedules));

    document.getElementById('shift-name').value = '';
    document.getElementById('shift-start').value = '';
    document.getElementById('shift-end').value = '';

    renderSchedule();
}

function deleteShift(id) {
    schedules = schedules.filter(item => item.id !== id);
    localStorage.setItem('schedules', JSON.stringify(schedules));
    renderSchedule();
}

function filterSchedule(filter) {
    currentFilter = filter;
    document.getElementById('filter-all').className = filter === 'all' ? 'px-3 py-1 text-xs rounded-full bg-indigo-600 text-white font-medium' : 'px-3 py-1 text-xs rounded-full bg-slate-200 text-slate-700 font-medium';
    document.getElementById('filter-today').className = filter === 'today' ? 'px-3 py-1 text-xs rounded-full bg-indigo-600 text-white font-medium' : 'px-3 py-1 text-xs rounded-full bg-slate-200 text-slate-700 font-medium';
    renderSchedule();
}

function renderSchedule() {
    const listEl = document.getElementById('shift-list');
    if (!listEl) return;
    listEl.innerHTML = '';

    let filtered = schedules;
    if (currentFilter === 'today') {
        const todayStr = new Date().toISOString().split('T')[0];
        filtered = schedules.filter(item => item.date === todayStr);
    }

    if (filtered.length === 0) {
        listEl.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">No scheduled events found.</p>`;
        return;
    }

    filtered.forEach(item => {
        let badgeColor = 'bg-blue-100 text-blue-700';
        if (item.category === 'Work') badgeColor = 'bg-emerald-100 text-emerald-700';
        if (item.category === 'Personal') badgeColor = 'bg-amber-100 text-amber-700';

        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-start";
        card.innerHTML = `
            <div class="space-y-1">
                <div class="flex items-center space-x-2">
                    <span class="text-xs px-2 py-0.5 rounded-full font-medium ${badgeColor}">${item.category}</span>
                    <span class="text-xs text-slate-400">${item.date}</span>
                </div>
                <h4 class="font-semibold text-slate-800 text-sm">${item.name}</h4>
                ${item.startTime || item.endTime ? `<p class="text-xs text-slate-500">🕒 ${item.startTime \vert{}\vert{} '??'} -${item.endTime || '??'}</p>` : ''}
            </div>
            <button onclick="deleteShift(${item.id})" class="text-slate-300 hover:text-red-500 text-xs font-bold px-2 py-1">✕</button>
        `;
        listEl.appendChild(card);
    });
}
    </script>
</body>
</html>
